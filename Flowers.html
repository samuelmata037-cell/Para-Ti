<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para ti 💛</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#03050b;

    font-family:
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    user-select:none;
}

#canvas-container{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
}

canvas{
    display:block;
}


/* =========================================================
   INTRO
========================================================= */

#intro{
    position:fixed;
    inset:0;
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;
    padding:24px;

    background:
        radial-gradient(
            circle at center,
            rgba(38,48,85,.38),
            rgba(2,5,12,.96) 70%
        );

    opacity:1;
    visibility:visible;

    transition:
        opacity 2.8s cubic-bezier(.22,1,.36,1),
        visibility 2.8s ease;
}

#intro.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.intro-box{
    width:min(560px,92vw);

    padding:
        38px
        30px;

    border:
        1px solid
        rgba(255,220,100,.25);

    border-radius:28px;

    background:
        rgba(8,13,28,.58);

    backdrop-filter:
        blur(18px);

    box-shadow:
        0 20px 80px
        rgba(0,0,0,.45);

    transform:
        translateY(0)
        scale(1);

    transition:
        transform 2.8s cubic-bezier(.22,1,.36,1),
        opacity 2.5s ease;
}

#intro.hide .intro-box{
    transform:
        translateY(-18px)
        scale(.97);

    opacity:0;
}

.intro-title{
    margin:
        0 0 12px;

    color:#ffe58a;

    font-size:
        clamp(
            2rem,
            7vw,
            4rem
        );

    line-height:1;
    letter-spacing:-.04em;
}

.intro-text{
    margin:
        0 0 26px;

    color:
        rgba(
            255,
            255,
            255,
            .76
        );

    font-size:
        clamp(
            .95rem,
            2vw,
            1.1rem
        );

    line-height:1.6;
}

#start-btn{
    border:0;

    padding:
        15px
        28px;

    border-radius:999px;

    color:#2b2100;

    background:
        linear-gradient(
            135deg,
            #ffe36e,
            #f6b928
        );

    font-weight:800;
    font-size:1rem;

    cursor:pointer;

    box-shadow:
        0 8px 30px
        rgba(
            246,
            185,
            40,
            .28
        );

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

#start-btn:hover{
    transform:
        translateY(-2px)
        scale(1.02);

    box-shadow:
        0 12px 38px
        rgba(
            246,
            185,
            40,
            .4
        );
}

#start-btn:active{
    transform:
        scale(.98);
}


/* =========================================================
   INTERFAZ
========================================================= */

#hint{
    position:fixed;

    top:18px;
    left:50%;

    transform:
        translateX(-50%);

    z-index:10;

    padding:
        9px
        16px;

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            .1
        );

    border-radius:999px;

    color:
        rgba(
            255,
            255,
            255,
            .72
        );

    background:
        rgba(
            5,
            9,
            20,
            .5
        );

    backdrop-filter:
        blur(12px);

    font-size:12px;

    opacity:0;

    transition:
        opacity 2s ease;

    pointer-events:none;
}

#hint.show{
    opacity:1;
}

#phase{
    position:fixed;

    left:50%;
    bottom:22px;

    transform:
        translateX(-50%);

    z-index:10;

    color:
        rgba(
            255,
            255,
            255,
            .62
        );

    font-size:12px;

    letter-spacing:.08em;

    text-transform:uppercase;

    opacity:0;

    transition:
        opacity 2s ease;

    pointer-events:none;
}

#phase.show{
    opacity:1;
}

#audio-error{
    position:fixed;

    left:50%;
    bottom:55px;

    transform:
        translateX(-50%);

    z-index:30;

    padding:
        8px 14px;

    border-radius:12px;

    background:
        rgba(
            120,
            20,
            20,
            .75
        );

    color:white;

    font-size:12px;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .5s ease;
}

#audio-error.show{
    opacity:1;
}

</style>
</head>


<body>


<audio
    id="musica"
    preload="auto"
    loop
    playsinline
>
    <source
        src="./mrs-magic.mp3"
        type="audio/mpeg"
    >

    Tu navegador no puede reproducir audio.
</audio>


<div id="canvas-container"></div>


<div id="intro">

    <div class="intro-box">

        <h1 class="intro-title">
            Este es mi regalo!!
        </h1>

        <p class="intro-text">
            Mi pequeño regalo, mi hermanita.
            Todo esto es para ti y mas
            Entra a tu jardin
        </p>

        <button id="start-btn">
            Tu propio jardin ✨
        </button>

    </div>

</div>


<div id="hint">
    
</div>


<div id="phase">
   Para ti
</div>


<div id="audio-error">
    No se pudo reproducir mrs-magic.mp3
</div>


<script>


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const CONFIG = {

    flowers:250,

    vegetation:220,

    fireflies:1200,

    fieldRadius:310,

    cycleDuration:20000,

    introDuration:2800,

    cameraDistance:360,

    minDistance:85,

    maxDistance:620

};


/* =========================================================
   VARIABLES
========================================================= */

let scene;
let camera;
let renderer;

let ambientLight;
let sunLight;
let moonLight;

let ground;

let flowers=[];
let vegetation=[];

let fireflies=null;

let started=false;

let cycleTime=0;

let lastTime=
    performance.now();

let introProgress=0;

let cameraX=.38;
let cameraY=.35;

let cameraDistance=
    CONFIG.cameraDistance;

let dragging=false;

let pointerId=null;

let previousPointer={
    x:0,
    y:0
};


/* =========================================================
   AUDIO
========================================================= */

const musica=
    document.getElementById(
        "musica"
    );

const audioError=
    document.getElementById(
        "audio-error"
    );

musica.volume=.55;


/* =========================================================
   MATERIALES
========================================================= */

const M={};


/* =========================================================
   GEOMETRÍAS
========================================================= */

const G={};


/* =========================================================
   COLORES
========================================================= */

const COLORS={

    night:
        new THREE.Color(
            0x050812
        ),

    day:
        new THREE.Color(
            0x76c9ed
        ),

    fogDay:
        new THREE.Color(
            0x86cfee
        ),

    sunWarm:
        new THREE.Color(
            0xffb35c
        ),

    sunDay:
        new THREE.Color(
            0xfff3d0
        )

};


/* =========================================================
   SUAVIZADO
========================================================= */

function smoothstep(t){

    t=Math.max(
        0,
        Math.min(
            1,
            t
        )
    );

    return t*t*(3-2*t);
}


function smootherstep(t){

    t=Math.max(
        0,
        Math.min(
            1,
            t
        )
    );

    return t*t*t*
        (
            t*
            (t*6-15)
            +10
        );
}


/* =========================================================
   INICIALIZACIÓN
========================================================= */

function init(){

    scene=
        new THREE.Scene();


    scene.background=
        COLORS.night.clone();


    scene.fog=
        new THREE.FogExp2(
            COLORS.night.clone(),
            .002
        );


    camera=
        new THREE.PerspectiveCamera(

            52,

            innerWidth/
            innerHeight,

            1,

            1800

        );


    renderer=
        new THREE.WebGLRenderer({

            antialias:true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(
            devicePixelRatio,
            1.5
        )

    );


    renderer.setSize(
        innerWidth,
        innerHeight
    );


    renderer.outputEncoding=
        THREE.sRGBEncoding;


    renderer.shadowMap.enabled=
        true;


    renderer.shadowMap.type=
        THREE.PCFSoftShadowMap;


    document
        .getElementById(
            "canvas-container"
        )
        .appendChild(
            renderer.domElement
        );


    createMaterials();

    createGeometries();

    createLights();

    createGround();

    createFlowers();

    createVegetation();

    createFireflies();

    updateCamera();

    setupControls();

    addEventListener(
        "resize",
        resize
    );

    requestAnimationFrame(
        animate
    );
}


/* =========================================================
   MATERIALES
========================================================= */

function createMaterials(){

    M.stem=
        new THREE.MeshLambertMaterial({

            color:
                0x315d18

        });


    M.leaf=
        new THREE.MeshLambertMaterial({

            color:
                0x3d761e,

            side:
                THREE.DoubleSide

        });


    M.petal=
        new THREE.MeshPhongMaterial({

            color:
                0xffc400,

            emissive:
                0x3a1800,

            specular:
                0xffffff,

            shininess:
                28,

            side:
                THREE.DoubleSide

        });


    M.petalLight=
        new THREE.MeshPhongMaterial({

            color:
                0xffdf32,

            emissive:
                0x4c2400,

            specular:
                0xffffff,

            shininess:
                30,

            side:
                THREE.DoubleSide

        });


    M.center=
        new THREE.MeshLambertMaterial({

            color:
                0x9acb35

        });


    M.anther=
        new THREE.MeshPhongMaterial({

            color:
                0x63320b,

            shininess:
                15

        });


    M.grass=
        new THREE.MeshLambertMaterial({

            color:
                0x39701d,

            side:
                THREE.DoubleSide

        });


    M.shrub=
        new THREE.MeshLambertMaterial({

            color:
                0x245619

        });

}


/* =========================================================
   GEOMETRÍAS
========================================================= */

function createGeometries(){


    /* =====================================================
       PÉTALO DE LIRIO
       
       Ahora tiene:
       - más segmentos
       - forma más ancha
       - curvatura
       - punta redondeada
       - ondulación lateral
    ===================================================== */

    const shape=
        new THREE.Shape();


    shape.moveTo(
        0,
        0
    );


    shape.bezierCurveTo(
        5,
        15,
        15,
        35,
        20,
        58
    );


    shape.bezierCurveTo(
        24,
        78,
        25,
        101,
        13,
        118
    );


    shape.bezierCurveTo(
        7,
        126,
        2,
        130,
        0,
        132
    );


    shape.bezierCurveTo(
        -2,
        130,
        -7,
        126,
        -13,
        118
    );


    shape.bezierCurveTo(
        -25,
        101,
        -24,
        78,
        -20,
        58
    );


    shape.bezierCurveTo(
        -15,
        35,
        -5,
        15,
        0,
        0
    );


    G.petal=
        new THREE.ShapeGeometry(
            shape,
            20
        );


    const p=
        G.petal.attributes.position;


    for(
        let i=0;
        i<p.count;
        i++
    ){

        const x=
            p.getX(i);

        const y=
            p.getY(i);


        const t=
            Math.max(
                0,
                Math.min(
                    1,
                    y/132
                )
            );


        /*
           Curvatura principal.
           La parte superior se arquea
           ligeramente hacia atrás.
        */

        const curve=
            Math.pow(
                t,
                1.35
            )*
            12;


        /*
           Curvatura lateral.
           Esto evita que el pétalo
           parezca una tabla plana.
        */

        const sideCurve=
            Math.sin(
                t*Math.PI
            )*
            (
                x*x*
                .018
            );


        /*
           Ligera ondulación.
        */

        const wave=
            Math.sin(
                t*Math.PI*2.4
            )*
            Math.abs(x)*
            .055;


        /*
           Elevación de la punta.
        */

        const tipLift=
            Math.pow(
                t,
                3
            )*
            8;


        p.setZ(
            i,
            curve+
            sideCurve+
            wave+
            tipLift
        );

    }


    G.petal.computeVertexNormals();


    /* =====================================================
       HOJA
    ===================================================== */

    G.leaf=
        new THREE.PlaneGeometry(
            12,
            70,
            3,
            7
        );


    const lp=
        G.leaf.attributes.position;


    for(
        let i=0;
        i<lp.count;
        i++
    ){

        const y=
            lp.getY(i);


        lp.setZ(

            i,

            Math.sin(
                (
                    (y+35)/70
                )*
                Math.PI
            )*10

        );

    }


    G.leaf.computeVertexNormals();


    /* =====================================================
       ESTAMBRES
    ===================================================== */

    G.stamen=
        new THREE.CylinderGeometry(
            .35,
            .35,
            25,
            5
        );


    G.anther=
        new THREE.SphereGeometry(
            2.2,
            6,
            6
        );


    G.center=
        new THREE.SphereGeometry(
            3.2,
            7,
            7
        );


    /* =====================================================
       VEGETACIÓN
    ===================================================== */

    G.grass=
        new THREE.ConeGeometry(
            1.8,
            25,
            5
        );


    G.shrub=
        new THREE.IcosahedronGeometry(
            10,
            0
        );


    G.ground=
        new THREE.PlaneGeometry(
            1100,
            1100
        );

}


/* =========================================================
   LUCES
========================================================= */

function createLights(){

    ambientLight=
        new THREE.AmbientLight(
            0x334466,
            .05
        );

    scene.add(
        ambientLight
    );


    sunLight=
        new THREE.DirectionalLight(
            0xffc46b,
            .05
        );


    sunLight.position.set(
        120,
        220,
        -120
    );


    sunLight.castShadow=
        true;


    sunLight.shadow.mapSize.set(
        1024,
        1024
    );


    sunLight.shadow.camera.left=
        -400;

    sunLight.shadow.camera.right=
        400;

    sunLight.shadow.camera.top=
        400;

    sunLight.shadow.camera.bottom=
        -400;


    scene.add(
        sunLight
    );


    moonLight=
        new THREE.DirectionalLight(
            0x6688bb,
            .1
        );


    moonLight.position.set(
        -150,
        180,
        120
    );


    scene.add(
        moonLight
    );

}


/* =========================================================
   SUELO
========================================================= */

function createGround(){

    ground=
        new THREE.Mesh(

            G.ground,

            new THREE.MeshStandardMaterial({

                color:
                    0x173516,

                roughness:
                    1,

                metalness:
                    0

            })

        );


    ground.rotation.x=
        -Math.PI/2;


    ground.receiveShadow=
        true;


    scene.add(
        ground
    );

}


/* =========================================================
   CREAR FLOR
========================================================= */

function createFlower(){

    const group=
        new THREE.Group();


    const height=
        105+
        Math.random()*40;


    /* =====================================================
       TALLO
    ===================================================== */

    const stem=
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                1.7,
                2.2,
                height,
                6
            ),

            M.stem

        );


    stem.position.y=
        height/2;


    stem.castShadow=
        true;


    group.add(
        stem
    );


    /* =====================================================
       HOJAS
    ===================================================== */

    for(
        let i=0;
        i<2;
        i++
    ){

        const leaf=
            new THREE.Mesh(
                G.leaf,
                M.leaf
            );


        leaf.position.y=
            height*
            (
                .28+
                i*.27
            );


        leaf.rotation.x=
            Math.PI/3;


        leaf.rotation.y=
            i*Math.PI+
            (
                Math.random()-.5
            )*.5;


        leaf.scale.set(

            .8+
            Math.random()*.25,

            .9+
            Math.random()*.2,

            1

        );


        group.add(
            leaf
        );

    }


    /* =====================================================
       CABEZA
    ===================================================== */

    const head=
        new THREE.Group();


    head.position.y=
        height;


    group.add(
        head
    );


    /* =====================================================
       PÉTALOS
    ===================================================== */

    for(
        let i=0;
        i<6;
        i++
    ){

        const pivot=
            new THREE.Group();


        const angle=
            (
                i/6
            )*
            Math.PI*2;


        pivot.rotation.y=
            angle;


        head.add(
            pivot
        );


        const petal=
            new THREE.Mesh(

                G.petal,

                i%2
                    ?
                    M.petalLight
                    :
                    M.petal

            );


        /*
           Los pétalos nacen ligeramente
           inclinados hacia el centro.
        */

        petal.position.set(
            0,
            1.5,
            0
        );


        petal.rotation.x=
            -.02;


        /*
           Más ancho y más largo.
        */

        petal.scale.set(

            .50,
            .52,
            .50

        );


        petal.userData.baseScale=
            petal.scale.clone();


        petal.scale.multiplyScalar(
            .001
        );


        petal.userData.petal=
            true;


        petal.userData.closedRotation=
            -.02;


        /*
           Cada pétalo abre con un ángulo
           ligeramente diferente.
        */

        petal.userData.openRotation=
            -1.18+
            (
                Math.random()-.5
            )*.13;


        /*
           Variación de inclinación
           hacia los lados.
        */

        petal.userData.sideTilt=
            (
                Math.random()-.5
            )*.16;


        /*
           Curvatura individual.
        */

        petal.userData.curve=
            (
                Math.random()-.5
            )*.10;


        petal.castShadow=
            false;


        pivot.add(
            petal
        );

    }


    /* =====================================================
       CENTRO
    ===================================================== */

    const center=
        new THREE.Mesh(
            G.center,
            M.center
        );


    center.position.y=
        9;


    center.scale.setScalar(
        .001
    );


    center.userData.baseScale=
        new THREE.Vector3(
            1,
            1,
            1
        );


    center.userData.center=
        true;


    head.add(
        center
    );


    /* =====================================================
       ESTAMBRES
    ===================================================== */

    for(
        let i=0;
        i<6;
        i++
    ){

        const stamen=
            new THREE.Group();


        const stamenStem=
            new THREE.Mesh(
                G.stamen,
                M.center
            );


        stamenStem.position.y=
            10;


        stamen.add(
            stamenStem
        );


        const anther=
            new THREE.Mesh(
                G.anther,
                M.anther
            );


        anther.position.y=
            23;


        anther.scale.set(
            1,
            .8,
            .8
        );


        stamen.add(
            anther
        );


        stamen.rotation.y=
            (
                i/6
            )*
            Math.PI*2;


        stamen.scale.setScalar(
            .001
        );


        stamen.userData.baseScale=
            new THREE.Vector3(
                1,
                1,
                1
            );


        stamen.userData.stamen=
            true;


        head.add(
            stamen
        );

    }


    return{

        group,

        head,

        bloom:0,

        speed:
            .6+
            Math.random()*.6,

        phase:
            Math.random()*
            Math.PI*2,

        height

    };

}


/* =========================================================
   CREAR FLORES
========================================================= */

function createFlowers(){

    for(
        let i=0;
        i<CONFIG.flowers;
        i++
    ){

        const flower=
            createFlower();


        const r=
            Math.sqrt(
                Math.random()
            )*
            CONFIG.fieldRadius;


        const a=
            Math.random()*
            Math.PI*2;


        flower.group.position.set(

            Math.cos(a)*r,

            0,

            Math.sin(a)*r

        );


        flower.group.rotation.y=
            Math.random()*
            Math.PI*2;


        const s=
            .55+
            Math.random()*.55;


        flower.group.scale.setScalar(
            s
        );


        scene.add(
            flower.group
        );


        flowers.push(
            flower
        );

    }

}


/* =========================================================
   VEGETACIÓN
========================================================= */

function createVegetation(){

    for(
        let i=0;
        i<CONFIG.vegetation;
        i++
    ){

        const type=
            Math.random();


        let object;


        if(type<.72){

            object=
                new THREE.Mesh(
                    G.grass,
                    M.grass
                );


            object.scale.set(

                .5+
                Math.random()*.8,

                .6+
                Math.random()*1.2,

                .5+
                Math.random()*.8

            );

        }

        else{

            object=
                new THREE.Mesh(
                    G.shrub,
                    M.shrub
                );


            object.scale.setScalar(
                .5+
                Math.random()*.9
            );

        }


        const r=
            Math.sqrt(
                Math.random()
            )*
            CONFIG.fieldRadius;


        const a=
            Math.random()*
            Math.PI*2;


        object.position.set(

            Math.cos(a)*r,

            type<.72
                ?
                10
                :
                7,

            Math.sin(a)*r

        );


        object.rotation.y=
            Math.random()*
            Math.PI*2;


        object.castShadow=
            true;


        scene.add(
            object
        );


        vegetation.push(
            object
        );

    }

}


/* =========================================================
   LUCIÉRNAGAS
========================================================= */

function createFireflies(){

    const geometry=
        new THREE.BufferGeometry();


    const positions=
        new Float32Array(

            CONFIG.fireflies*3

        );


    const data=[];


    for(
        let i=0;
        i<CONFIG.fireflies;
        i++
    ){

        const r=
            Math.sqrt(
                Math.random()
            )*
            410;


        const a=
            Math.random()*
            Math.PI*2;


        const x=
            Math.cos(a)*r;


        const z=
            Math.sin(a)*r;


        const y=
            12+
            Math.random()*165;


        positions[
            i*3
        ]=
            x;


        positions[
            i*3+1
        ]=
            y;


        positions[
            i*3+2
        ]=
            z;


        data.push({

            x,

            y,

            z,

            phase:
                Math.random()*
                Math.PI*2,

            speed:
                .25+
                Math.random()*.95,

            drift:
                5+
                Math.random()*12,

            vertical:
                4+
                Math.random()*10

        });

    }


    geometry.setAttribute(

        "position",

        new THREE.BufferAttribute(

            positions,

            3

        )

    );


    const material=
        new THREE.PointsMaterial({

            color:
                0xffe66d,

            size:
                2.8,

            transparent:
                true,

            opacity:
                0,

            blending:
                THREE.AdditiveBlending,

            depthWrite:
                false

        });


    fireflies=
        new THREE.Points(

            geometry,

            material

        );


    fireflies.userData.data=
        data;


    scene.add(
        fireflies
    );

}


/* =========================================================
   CÁMARA
========================================================= */

function updateCamera(){

    const cosX=
        Math.cos(
            cameraX
        );


    const sinX=
        Math.sin(
            cameraX
        );


    camera.position.x=
        cameraDistance*
        Math.sin(
            cameraY
        )*
        cosX;


    camera.position.y=
        cameraDistance*
        sinX;


    camera.position.z=
        cameraDistance*
        Math.cos(
            cameraY
        )*
        cosX;


    camera.lookAt(
        0,
        45,
        0
    );

}


/* =========================================================
   CONTROLES
========================================================= */

function setupControls(){

    const container=
        renderer.domElement;


    container.addEventListener(

        "pointerdown",

        e=>{

            dragging=true;

            pointerId=
                e.pointerId;


            previousPointer.x=
                e.clientX;


            previousPointer.y=
                e.clientY;


            container.setPointerCapture(
                e.pointerId
            );

        }

    );


    container.addEventListener(

        "pointermove",

        e=>{

            if(

                !dragging ||

                e.pointerId !==
                pointerId

            ){

                return;

            }


            const dx=
                e.clientX-
                previousPointer.x;


            const dy=
                e.clientY-
                previousPointer.y;


            cameraY-=
                dx*.005;


            cameraX+=
                dy*.005;


            cameraX=
                Math.max(

                    .08,

                    Math.min(

                        Math.PI/2.15,

                        cameraX

                    )

                );


            previousPointer.x=
                e.clientX;


            previousPointer.y=
                e.clientY;


            updateCamera();

        }

    );


    const stop=()=>{

        dragging=false;

        pointerId=null;

    };


    container.addEventListener(
        "pointerup",
        stop
    );


    container.addEventListener(
        "pointercancel",
        stop
    );


    container.addEventListener(

        "wheel",

        e=>{

            e.preventDefault();


            cameraDistance+=
                e.deltaY*.3;


            cameraDistance=
                Math.max(

                    CONFIG.minDistance,

                    Math.min(

                        CONFIG.maxDistance,

                        cameraDistance

                    )

                );


            updateCamera();

        },

        {
            passive:false
        }

    );

}


/* =========================================================
   INICIAR EXPERIENCIA
========================================================= */

document
    .getElementById("start-btn")
    .addEventListener(

        "click",

        async ()=>{

            if(started){
                return;
            }


            started=true;

            cycleTime=0;

            introProgress=0;


            try{

                musica.currentTime=0;

                musica.volume=.55;

                await musica.play();

                console.log(
                    "Música iniciada correctamente."
                );

            }

            catch(error){

                console.error(
                    "Error al reproducir la música:",
                    error
                );

                audioError.classList.add(
                    "show"
                );

                setTimeout(

                    ()=>{
                        audioError.classList.remove(
                            "show"
                        );
                    },

                    5000

                );

            }


            document
                .getElementById("intro")
                .classList.add(
                    "hide"
                );


            document
                .getElementById("hint")
                .classList.add(
                    "show"
                );


            document
                .getElementById("phase")
                .classList.add(
                    "show"
                );

        }

    );


/* =========================================================
   CICLO DÍA → ATARDECER → NOCHE
========================================================= */

function updateCycle(delta){

    if(!started){
        return;
    }


    cycleTime+=delta;


    const rawProgress=
        Math.min(

            cycleTime/
            CONFIG.cycleDuration,

            1

        );


    const progress=
        smootherstep(
            rawProgress
        );


    let dayFactor;


    if(progress<.55){

        dayFactor=
            progress/.55;

    }

    else{

        dayFactor=
            1-
            (
                progress-.55
            )/.45;

    }


    dayFactor=
        smoothstep(
            dayFactor
        );


    introProgress+=
        delta/
        CONFIG.introDuration;


    const introEase=
        smootherstep(

            Math.min(
                introProgress,
                1
            )

        );


    const visibleDayFactor=
        dayFactor*
        introEase;


    scene.background
        .copy(
            COLORS.night
        )
        .lerp(

            COLORS.day,

            visibleDayFactor

        );


    scene.fog.color
        .copy(
            COLORS.night
        )
        .lerp(

            COLORS.fogDay,

            visibleDayFactor

        );


    scene.fog.density=
        .0023-
        visibleDayFactor*.0007;


    ambientLight.intensity=
        (
            .25+
            visibleDayFactor*.62
        )*
        introEase;


    ambientLight.color.setHSL(

        .60,

        .35,

        .25+
        .35*
        visibleDayFactor

    );


    sunLight.intensity=
        (
            .15+
            visibleDayFactor*1.65
        )*
        introEase;


    sunLight.color
        .copy(
            COLORS.sunWarm
        )
        .lerp(

            COLORS.sunDay,

            visibleDayFactor

        );


    moonLight.intensity=
        (
            .12+
            (
                1-
                visibleDayFactor
            )*.55
        )*
        introEase;


    const phase=
        document.getElementById(
            "phase"
        );


    if(progress<.16){

        phase.textContent=
            "El jardín despierta";

    }

    else if(progress<.40){

        phase.textContent=
            "Un nuevo día comienza";

    }

    else if(progress<.68){

        phase.textContent=
            "El campo está floreciendo";

    }

    else if(progress<.92){

        phase.textContent=
            "El sol comienza a esconderse";

    }

    else{

        phase.textContent=
            "Buenas noches ✨";

    }


    const fireflyFactor=
        Math.pow(

            1-
            visibleDayFactor,

            2

        );


    fireflies.material.opacity=
        fireflyFactor*
        .95*
        introEase;


    /* =====================================================
       FLORES
    ===================================================== */

    const bloomStart=
        .16;


    const bloomEnd=
        .72;


    let bloomProgress=
        (
            progress-
            bloomStart
        )/
        (
            bloomEnd-
            bloomStart
        );


    bloomProgress=
        Math.max(

            0,

            Math.min(
                1,
                bloomProgress
            )

        );


    const smoothBloom=
        smootherstep(
            bloomProgress
        );


    for(
        let i=0;
        i<flowers.length;
        i++
    ){

        const flower=
            flowers[i];


        const delay=
            (
                i%60
            )/60*.40;


        const localBloom=
            Math.max(

                0,

                Math.min(

                    1,

                    (
                        smoothBloom-
                        delay
                    )/
                    (
                        1-delay
                    )

                )

            );


        flower.bloom=
            localBloom;


        const head=
            flower.head;


        for(
            let j=0;
            j<head.children.length;
            j++
        ){

            const child=
                head.children[j];


            /* =================================================
               PÉTALO
            ================================================= */

            if(

                child.children &&

                child.children.length &&

                child.children[0] &&

                child.children[0].userData &&

                child.children[0]
                    .userData
                    .petal

            ){

                const petal=
                    child.children[0];


                /*
                   Crecimiento inicial.
                */

                const growthPhase=
                    smootherstep(

                        Math.min(

                            1,

                            localBloom/.58

                        )

                    );


                /*
                   Apertura progresiva.
                */

                const openingPhase=
                    smootherstep(

                        Math.max(

                            0,

                            Math.min(

                                1,

                                (
                                    localBloom-
                                    .36
                                )/.64

                            )

                        )

                    );


                petal.scale
                    .copy(
                        petal.userData.baseScale
                    )
                    .multiplyScalar(
                        growthPhase
                    );


                const closed=
                    petal.userData
                        .closedRotation;


                const open=
                    petal.userData
                        .openRotation;


                petal.rotation.x=
                    closed+
                    (
                        open-
                        closed
                    )*
                    openingPhase;


                /*
                   Cada pétalo se inclina
                   ligeramente de forma distinta.
                */

                petal.rotation.z=
                    petal.userData.sideTilt*
                    openingPhase;


                /*
                   Pequeña variación durante
                   la apertura para dar
                   sensación orgánica.
                */

                petal.rotation.y=
                    petal.userData.curve*
                    Math.sin(
                        openingPhase*
                        Math.PI
                    );

            }


            /* =================================================
               CENTRO
            ================================================= */

            else if(

                child.userData &&

                child.userData.center

            ){

                const centerGrowth=
                    smootherstep(

                        Math.max(

                            0,

                            Math.min(

                                1,

                                (
                                    localBloom-
                                    .58
                                )/.42

                            )

                        )

                    );


                child.scale
                    .copy(
                        child.userData.baseScale
                    )
                    .multiplyScalar(
                        centerGrowth
                    );

            }


            /* =================================================
               ESTAMBRES
            ================================================= */

            else if(

                child.userData &&

                child.userData.stamen

            ){

                const stamenGrowth=
                    smootherstep(

                        Math.max(

                            0,

                            Math.min(

                                1,

                                (
                                    localBloom-
                                    .66
                                )/.34

                            )

                        )

                    );


                child.scale
                    .copy(
                        child.userData.baseScale
                    )
                    .multiplyScalar(
                        stamenGrowth
                    );

            }

        }

    }


    /* =====================================================
       VIENTO
    ===================================================== */

    for(
        let i=0;
        i<flowers.length;
        i++
    ){

        const flower=
            flowers[i];


        const wind=
            .010+
            visibleDayFactor*
            .045;


        const movement=
            Math.sin(

                cycleTime*
                .001*
                flower.speed+
                flower.phase

            )*
            wind;


        headWind(
            flower,
            movement
        );

    }


    /* =====================================================
       VEGETACIÓN
    ===================================================== */

    for(
        let i=0;
        i<vegetation.length;
        i++
    ){

        const object=
            vegetation[i];


        object.rotation.z=
            Math.sin(

                cycleTime*
                .0012+
                i

            )*.025;

    }


    /* =====================================================
       FINAL
    ===================================================== */

    if(rawProgress>=1){

        cycleTime=
            CONFIG.cycleDuration;


        phase.textContent=
            "Te amo ✨";


        ambientLight.intensity=
            .25;


        sunLight.intensity=
            .05;


        moonLight.intensity=
            .67;


        fireflies.material.opacity=
            .95;

    }

}


/* =========================================================
   VIENTO
========================================================= */

function headWind(
    flower,
    movement
){

    flower.head.rotation.z=
        movement;


    flower.head.rotation.x=
        Math.cos(

            cycleTime*
            .0008*
            flower.speed+
            flower.phase

        )*
        movement*
        .7;

}


/* =========================================================
   ANIMAR LUCIÉRNAGAS
========================================================= */

function animateFireflies(time){

    if(!fireflies){
        return;
    }


    const positions=
        fireflies
            .geometry
            .attributes
            .position
            .array;


    const data=
        fireflies
            .userData
            .data;


    for(
        let i=0;
        i<data.length;
        i++
    ){

        const f=
            data[i];


        positions[i*3]=

            f.x+

            Math.sin(

                time*
                .00045*
                f.speed+
                f.phase

            )*
            f.drift;


        positions[i*3+1]=

            f.y+

            Math.sin(

                time*
                .0007*
                f.speed+
                f.phase

            )*
            f.vertical;


        positions[i*3+2]=

            f.z+

            Math.cos(

                time*
                .0004*
                f.speed+
                f.phase

            )*
            f.drift;

    }


    fireflies
        .geometry
        .attributes
        .position
        .needsUpdate=
            true;

}


/* =========================================================
   LOOP PRINCIPAL
========================================================= */

function animate(now){

    requestAnimationFrame(
        animate
    );


    const delta=
        Math.min(

            now-
            lastTime,

            50

        );


    lastTime=
        now;


    if(started){

        updateCycle(
            delta
        );

    }


    animateFireflies(
        now
    );


    if(

        started &&

        !dragging

    ){

        cameraY+=
            .0008;


        updateCamera();

    }


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    camera.aspect=
        innerWidth/
        innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        innerWidth,

        innerHeight

    );

}


/* =========================================================
   INICIAR
========================================================= */

init();

</script>
